[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trueset"
version = "0.2.0"
description = "Write a data-quality check once, run it anywhere -- pandas, DuckDB, or your warehouse -- plus cross-system reconciliation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "trueset contributors" }]
keywords = [
    "data-quality", "validation", "data-testing", "reconciliation",
    "data-diff", "dbt", "pyspark", "duckdb", "data-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/trueset-dev/trueset"
Repository = "https://github.com/trueset-dev/trueset"
Issues = "https://github.com/trueset-dev/trueset/issues"
Changelog = "https://github.com/trueset-dev/trueset/blob/main/CHANGELOG.md"

[project.optional-dependencies]
spark = ["pyspark>=3.4"]
sql = ["sqlalchemy>=2.0", "duckdb>=0.10"]
dev = ["pytest>=7.0", "pyarrow>=12.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[project.scripts]
trueset = "trueset.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/trueset"]
