[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay"
version = "0.0.1"
description = "Write a data-quality check once, run it anywhere -- pandas, Spark, or your warehouse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Your Name" }]
keywords = ["data-quality", "validation", "data-testing", "dbt", "pyspark"]
dependencies = [
    "pandas>=1.5",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.4"]
sql = ["sqlalchemy>=2.0", "duckdb>=0.10"]
dev = ["pytest>=7.0", "pyarrow>=12.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[project.scripts]
assay = "assay.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]
